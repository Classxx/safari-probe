name: probe
# Настоящий Safari (macOS) и Safari в симуляторе iOS на машинах GitHub.
# Запуск: gh workflow run probe.yml -f paths=/,/cart -f targets="mac:1440x900,ios:iPhone 16"
on:
  workflow_dispatch:
    inputs:
      paths: { description: 'страницы через запятую', default: '/' }
      targets: { description: 'mac:ШxВ, ios:<симулятор>, ipad:<симулятор>', default: 'mac:1440x900,mac:1152x700,ios:iPhone 16,ios:iPhone SE (3rd generation),ios:iPhone 16 Pro Max,ipad:iPad Air 11-inch (M2)' }
      login: { description: 'войти тестовым покупателем', default: 'true' }
permissions: { contents: read }
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Safari — разрешить WebDriver
        run: |
          sudo safaridriver --enable
          defaults write com.apple.Safari AllowRemoteAutomation 1 || true
          xcrun simctl list devices available | grep -E "iPhone|iPad" | head -40
          sw_vers; /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" /Applications/Safari.app/Contents/Info.plist
      - name: Прогон
        env:
          BASE: ${{ secrets.BASE }}
          GATE: ${{ secrets.GATE }}
          PATHS: ${{ inputs.paths }}
          TARGETS: ${{ inputs.targets }}
          LOGIN: ${{ inputs.login }}
        run: node probe.mjs
      - name: Шифруем результат (публичный репозиторий — наружу только шифр)
        if: always()
        env: { ART_KEY: '${{ secrets.ART_KEY }}' }
        run: |
          tar czf out.tgz out
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in out.tgz -out out.tgz.enc -pass env:ART_KEY
          rm -rf out out.tgz
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: probe, path: out.tgz.enc, retention-days: 3 }
